services:
  - type: web
    name: family-id-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head && python scripts/seed.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./family_id_360.db

  - type: web
    name: family-id-frontend
    env: node
    buildCommand: "npm install && npm run build"
    startCommand: "npm run preview -- --port $PORT --host 0.0.0.0"
    envVars:
      - key: VITE_API_URL
        value: "https://family-id-backend.onrender.com/api/v1"
